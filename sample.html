<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Orchard Piper, customer experience audit (illustrative sample)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --canvas:#F7F8F3; --ink:#0A0B0D; --stone:#ECEDE6; --line:#D6D7CF; --mute:#5F615A;
  --moment:#A07A45; --trust:#3A2A1F; --on-trust:#F7F8F3; --conv:#8A5E33; --conv-bg:#F1E7DA; --conv-ink:#5E3E1E; --loy:#A89A87; --loy-bg:#EFEAE2; --loy-ink:#5A4E41; --moment-ink:#7A5A2E; --prio:#7A1424; --on-prio:#F7F8F3; --h1:#6B4524; --h2:#7A1424; --accent:#8A5E33; --box:#EFEAE2; --box-warm:#F3EADF; --moment-bg:#7A1424; --moment-fg:#EDE4D8; --moment-sub:#D5C4B2; --note-bg:#3A2A1F; --note-fg:#EFEAE2; --note-sub:#CDBFAF; --banner-bg:#0A0B0D; --banner-ink:#F7F8F3; --on-ink-mute:#b9bbb2;
  --font:'Jost','Futura','Century Gothic','Avenir Next',system-ui,sans-serif;
  --banner-h:40px; --side-w:264px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --canvas:#101110; --ink:#ECEDE6; --stone:#1A1B19; --line:#30322E; --mute:#A6A89E;
    --moment:#C9A46A; --trust:#D8C4AE; --on-trust:#161310; --conv:#C8955E; --conv-bg:#33271B; --conv-ink:#E6C7A2; --loy:#A89A87; --loy-bg:#2A2622; --loy-ink:#D6CCBF; --moment-ink:#D9B47C; --prio:#E0798A; --on-prio:#161310; --h1:#D9B48A; --h2:#E68A99; --accent:#C8955E; --box:#211E1A; --box-warm:#2A2119; --moment-bg:#5E0F1C; --moment-fg:#EFE6DA; --moment-sub:#D5C4B2; --note-bg:#2A2119; --note-fg:#EFE6DA; --note-sub:#CDBFAF; --banner-bg:#ECEDE6; --banner-ink:#101110; --on-ink-mute:#4a4c46; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --canvas:#101110; --ink:#ECEDE6; --stone:#1A1B19; --line:#30322E; --mute:#A6A89E;
  --moment:#C9A46A; --trust:#D8C4AE; --on-trust:#161310; --conv:#C8955E; --conv-bg:#33271B; --conv-ink:#E6C7A2; --loy:#A89A87; --loy-bg:#2A2622; --loy-ink:#D6CCBF; --moment-ink:#D9B47C; --prio:#E0798A; --on-prio:#161310; --h1:#D9B48A; --h2:#E68A99; --accent:#C8955E; --box:#211E1A; --box-warm:#2A2119; --moment-bg:#5E0F1C; --moment-fg:#EFE6DA; --moment-sub:#D5C4B2; --note-bg:#2A2119; --note-fg:#EFE6DA; --note-sub:#CDBFAF; --banner-bg:#ECEDE6; --banner-ink:#101110; --on-ink-mute:#4a4c46; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(var(--banner-h) + env(safe-area-inset-top,0px) + 24px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.55;min-height:100vh;min-height:100dvh}
body{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility}
.ap-mono{flex:none}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .ap-ring{stroke:#ECEDE6}}
:root[data-theme="dark"] .ap-ring{stroke:#ECEDE6}
img{max-width:100%;display:block}
button{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
#main:focus,#main:focus-visible{outline:none}
.sr{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}

/* Banner */
.banner{position:fixed;top:0;left:0;right:0;z-index:60;background:var(--banner-bg);color:var(--banner-ink);padding-top:env(safe-area-inset-top,0px)}
.banner p{margin:0;height:var(--banner-h);display:flex;align-items:center;gap:12px;padding:0 24px;font-size:14px;letter-spacing:.02em}
.banner svg{flex:none}

/* Logos */
.logo-wm{width:176px;height:auto}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo{filter:invert(1)}}
:root[data-theme="dark"] .logo{filter:invert(1)}

/* Shell */
.shell{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr);padding-top:var(--banner-h)}
.side{position:sticky;top:calc(var(--banner-h) + env(safe-area-inset-top,0px));height:calc(100vh - var(--banner-h));height:calc(100dvh - var(--banner-h) - env(safe-area-inset-top,0px));overflow-y:auto;border-right:1px solid var(--line);padding:28px 22px 32px;display:flex;flex-direction:column;gap:28px}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:10px;text-decoration:none;padding-top:4px}
.brand-sub{font-size:13px;color:var(--mute);line-height:1.2}
.nav ol{list-style:none;margin:0;padding:0}
.nav a{display:grid;grid-template-columns:30px 1fr;align-items:baseline;padding:8px 10px 8px 0;text-decoration:none;font-size:15.5px;line-height:1.3;border-left:2px solid transparent;padding-left:10px;margin-left:-12px}
.nav a .no{font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.nav a:hover{background:var(--stone)}
.nav a[aria-current="page"]{border-left-color:var(--ink);font-weight:500}
.nav .sub a{grid-template-columns:30px 1fr;font-size:14px;padding-top:5px;padding-bottom:5px;color:var(--mute)}
.nav .sub a[aria-current="page"]{color:var(--ink)}
.side-foot{margin-top:auto;font-size:13px;color:var(--mute);line-height:1.45}
.side-foot p{margin:0 0 10px}
.side-foot strong{color:var(--ink);font-weight:500}
.credit{display:flex;align-items:center;gap:8px}
.main{min-width:0;padding:48px clamp(24px,4vw,56px) 160px}
.content{max-width:980px;container-type:inline-size}
.content.wide{max-width:none}
@container (max-width:860px){.map{display:none}.mstack{display:block}}
.topbar{display:none}
.menu{display:none}

/* Page header */
.eyebrow{font-size:14px;color:var(--mute);margin:0 0 14px}
h1{font-weight:300;font-size:clamp(32px,4.4vw,52px);line-height:1.08;letter-spacing:-.015em;margin:0 0 24px;max-width:20ch}
.covers{border-left:2px solid var(--ink);padding:2px 0 2px 18px;margin:0 0 48px;max-width:64ch}
.covers h2{font-size:14px;font-weight:500;margin:0 0 4px;letter-spacing:0}
.covers p{margin:0;color:var(--mute)}
.sec{margin:0 0 56px}
.sec>h2{font-weight:400;font-size:clamp(22px,2.4vw,28px);line-height:1.2;margin:0 0 8px;letter-spacing:-.005em}
.sec>.lead{color:var(--mute);margin:0 0 24px;max-width:64ch}
p.body{max-width:64ch;margin:0 0 14px}

/* Overview */
.strip{display:grid;grid-template-columns:repeat(6,1fr);border-top:1px solid var(--ink)}
.strip div{padding:18px 12px 4px 0}
.strip div+div{padding-left:14px;border-left:1px solid var(--line)}
.strip b{display:block;font-weight:300;font-size:40px;line-height:1;letter-spacing:-.02em}
.strip span{display:block;font-size:14px;color:var(--mute);margin-top:8px}
.dates{margin:24px 0 0;font-size:15px;color:var(--mute)}
.dates strong{color:var(--ink);font-weight:500}
.use{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;border-top:1px solid var(--ink);padding-top:20px}
.use h3{font-weight:500;font-size:16px;margin:0 0 6px}
.use p{margin:0;color:var(--mute);font-size:15.5px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{display:grid;grid-template-columns:36px 1fr;gap:4px 8px;padding:18px 20px;border:1px solid var(--line);text-decoration:none}
.card:hover{border-color:var(--ink)}
.card .no{font-size:13px;color:var(--mute);padding-top:3px}
.card b{font-weight:400;font-size:19px;line-height:1.25}
.card span.d{grid-column:2;color:var(--mute);font-size:15px;line-height:1.4}

/* Ranked list */
.plist{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
.plist li{border-bottom:1px solid var(--line)}
.plist a{display:grid;grid-template-columns:40px 1fr auto;gap:14px;align-items:start;padding:16px 0;text-decoration:none}
.plist a:hover .pt-title{text-decoration:underline;text-underline-offset:3px}
.plist .rank{font-weight:300;font-size:30px;line-height:1;color:var(--prio)}
.pt-title{display:block;font-size:17px;line-height:1.3}
.pt-sub{display:block;font-size:14px;color:var(--mute);margin-top:4px}

/* Status */
.status{display:inline-flex;align-items:center;gap:8px;font-size:14px;white-space:nowrap}
.dot{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--ink);display:inline-block;flex:none}
.dot.on,.dot.done{background:var(--ink)}
.dot.close,.dot.prog{background:linear-gradient(90deg,var(--ink) 50%,transparent 50%)}

/* Method */
.timeline{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid var(--ink)}
.timeline li{padding:16px 16px 0 0}
.timeline li+li{padding-left:16px;border-left:1px solid var(--line)}
.timeline b{display:block;font-weight:500;font-size:15px;margin-bottom:6px}
.timeline span{display:block;font-size:15px;color:var(--mute);line-height:1.45}
.methods{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 40px;border-top:1px solid var(--ink)}
.methods div{padding:18px 0;border-bottom:1px solid var(--line)}
.methods b{display:block;font-weight:300;font-size:32px;line-height:1}
.methods h3{font-weight:500;font-size:16px;margin:8px 0 4px}
.methods p{margin:0;color:var(--mute);font-size:15.5px}
.defs{display:grid;grid-template-columns:200px minmax(0,1fr);border-top:1px solid var(--ink);margin:0}
.defs dt,.defs dd{padding:14px 0;border-bottom:1px solid var(--line);margin:0}
.defs dt{font-weight:500;padding-right:20px;display:flex;gap:10px;align-items:flex-start}
.defs dt .mk,.defs dt svg{margin-top:7px}
.defs dd{color:var(--mute);max-width:64ch}
.plain{margin:0;padding:0 0 0 20px;max-width:64ch}
.plain li{margin:0 0 8px}

/* Tables */
.tbl{width:100%;border-collapse:collapse;font-size:15.5px}
.tbl th{text-align:left;font-weight:500;font-size:14px;padding:12px 16px 12px 0;border-bottom:1px solid var(--ink);vertical-align:bottom}
.tbl td{padding:14px 16px 14px 0;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td.m{color:var(--mute)}
.tbl a{text-underline-offset:3px}
.tbl .num{font-variant-numeric:tabular-nums;white-space:nowrap}

/* Tags and marks */
.meta{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:13px;padding:3px 9px;border:1px solid var(--ink);white-space:nowrap}
.tag.trust{background:var(--trust);border-color:var(--trust);color:var(--on-trust)}
.tag.conversion{background:var(--conv-bg);border-color:var(--conv);color:var(--conv-ink)}
.tag.loyalty{background:var(--loy-bg);border-color:var(--loy);color:var(--loy-ink)}
.m-chip{font-size:13px;padding:3px 9px;border:1px solid var(--line);color:var(--mute);white-space:nowrap}
.mk{display:inline-block;width:9px;height:9px;border:1px solid var(--ink);flex:none}
.mk.t{background:var(--trust);border-color:var(--trust)}
.mk.c{background:var(--conv-bg);border-color:var(--conv)}
.mk.l{background:var(--loy);border-color:var(--loy)}
.mk.hd{border-color:var(--line);border-radius:50%}
.legend{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:16px;font-size:14px;color:var(--mute)}
.legend span{display:inline-flex;align-items:center;gap:8px}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--ink);background:var(--ink);color:var(--canvas);padding:10px 16px;font-size:15px;cursor:pointer;text-decoration:none}
.btn.ghost{background:none;color:var(--ink)}
.btn:hover{opacity:.85}
.linkbtn{background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:15px;color:var(--ink)}

/* Journey map */
.map{display:grid;grid-template-columns:104px repeat(8,minmax(0,1fr));border:1px solid var(--ink)}
.map>div{border-left:1px solid var(--line);border-top:1px solid var(--line);min-width:0}
.map .c0{border-left:0}
.map .r0{border-top:0}
.mhead{background:none;border:0;width:100%;height:100%;text-align:left;padding:12px 8px;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.mhead:hover{background:var(--stone)}
.mhead[aria-expanded="true"]{background:var(--ink);color:var(--canvas)}
.mhead .hn{font-size:14px;line-height:1.25;overflow-wrap:break-word;hyphens:auto}
.mhead .hc{font-size:12px;color:var(--mute);line-height:1.3}
.mhead[aria-expanded="true"] .hc{color:var(--on-ink-mute)}
.mconfl{padding:12px 10px;font-size:12.5px;line-height:1.3;color:var(--mute)}
.mconfl b{display:block;font-weight:500;color:var(--ink);font-size:14px;margin-bottom:4px}
.mconf{grid-column:2/-1;padding:4px 0 0}
.mconf svg{display:block;width:100%;height:auto}
.mlane{padding:12px 10px;font-size:14px;line-height:1.25}
.mcell{padding:8px 5px;display:flex;flex-direction:column;gap:6px}
.tp{overflow-wrap:break-word;hyphens:auto;display:flex;gap:6px;align-items:flex-start;width:100%;text-align:left;font-size:12.5px;line-height:1.25;padding:6px;border:1px solid var(--line);background:var(--canvas);cursor:pointer}
.tp>span{min-width:0}
.tp .mk,.tp svg{flex:none;margin-top:2px}
.tp.fr{border-color:var(--ink)}
.tp.hd{color:var(--mute)}
.tp:hover{background:var(--stone)}
.tp[aria-pressed="true"]{background:var(--ink);color:var(--canvas);border-color:var(--ink)}
.tp[aria-pressed="true"] .mk{border-color:var(--canvas)}
.tp[aria-pressed="true"] .mk.t{background:var(--canvas)}
.mstack{display:none}
.mst{border-top:1px solid var(--ink)}
.mst .mhead{padding:14px 0;flex-direction:row;justify-content:space-between;align-items:baseline;gap:12px}
.mst .mhead[aria-expanded="true"]{padding:14px 10px}
.mst ul{list-style:none;margin:0;padding:0 0 16px;display:flex;flex-direction:column;gap:6px}
.mst .tp{font-size:14.5px;padding:9px 10px}
.mst .tp small{display:block;font-size:12.5px;color:var(--mute);margin-top:2px}
.mst .tp[aria-pressed="true"] small{color:var(--on-ink-mute)}
.mconf-m{margin-bottom:14px}
.mconf-m svg{display:block;width:100%;height:auto}
.panel{border:1px solid var(--ink);border-top:0;padding:24px;display:grid;grid-template-columns:1.4fr 1fr;gap:32px}
.panel[hidden]{display:none}
.mst+.panel,.mstack .panel{border-top:1px solid var(--ink);margin-bottom:16px}
.panel h3{font-weight:400;font-size:22px;margin:0 0 6px}
.panel p{margin:0;color:var(--mute);max-width:56ch}
.panel .ph{font-size:14px;font-weight:500;color:var(--ink);margin:16px 0 0}
.panel ul.simple{margin:10px 0 0;padding:0;list-style:none}
.panel ul.simple li{display:flex;gap:10px;align-items:flex-start;font-size:15px;margin-top:6px}
.panel ul.simple li svg{flex:none;margin-top:5px}
.panel .btn{margin-top:16px}
.plinks{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.plinks a{display:flex;gap:10px;align-items:flex-start;text-decoration:none;border:1px solid var(--line);padding:10px 12px;font-size:15px;line-height:1.3}
.plinks a:hover{border-color:var(--ink)}
.plinks .mk,.plinks svg{flex:none;margin-top:4px}
.plinks small{display:block;color:var(--mute);font-size:13px;margin-top:3px}
.split{display:flex;flex-direction:column;gap:6px;font-size:15px;margin-top:8px}
.split div{display:flex;align-items:center;gap:10px}

/* Working well */
.stage-group{margin:0 0 36px}
.stage-group>h3{font-weight:400;font-size:20px;margin:0 0 4px;padding-bottom:10px;border-bottom:1px solid var(--ink);display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.stage-group>h3 small{font-size:14px;color:var(--mute)}
.win{padding:20px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:28px;scroll-margin-top:calc(var(--banner-h) + 24px)}
.win h4{font-weight:400;font-size:19px;line-height:1.25;margin:0 0 10px;display:flex;gap:10px;align-items:flex-start}
.win h4 svg{flex:none;margin-top:6px}
.win p{margin:0 0 10px;max-width:60ch}
.win .keep{font-size:15px;color:var(--mute);margin:0}
.win .keep b{color:var(--ink);font-weight:500}

/* Findings */
.filters{border:1px solid var(--ink);padding:14px 18px 8px;margin-bottom:12px}
.fgroup{display:grid;grid-template-columns:130px 1fr;gap:12px;align-items:start;padding:8px 0}
.fgroup+.fgroup{border-top:1px solid var(--line)}
.fgroup .flabel{font-size:15px;padding-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:none;padding:6px 12px;font-size:15px;cursor:pointer;line-height:1.3}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--canvas);border-color:var(--ink)}
.count{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;font-size:15px;color:var(--mute);margin:0 0 8px}
.findings{border-top:1px solid var(--ink)}
.finding{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:32px;padding:28px 0;border-bottom:1px solid var(--line);scroll-margin-top:calc(var(--banner-h) + 24px)}
.flash{animation:flash 1.8s ease}
@keyframes flash{0%,45%{background:var(--stone)}100%{background:transparent}}
.fnum{font-size:14px;color:var(--mute);display:flex;gap:10px;align-items:center}
.prio{border:1px solid var(--prio);padding:1px 8px;font-size:13px;color:var(--prio)}
.finding h3{font-weight:400;font-size:22px;line-height:1.22;margin:8px 0 14px}
.seen{margin-top:14px;font-size:14px;color:var(--mute)}
.evidence h4,.rec h4{font-weight:500;font-size:14px;margin:0 0 6px}
.evidence p{margin:0 0 20px;max-width:62ch}
.rec{border:1px solid var(--line);padding:16px 18px}
.rec.moment{border-color:var(--moment)}
.rec.moment h4{color:var(--moment-ink);display:flex;align-items:center;gap:8px}
.rec p{margin:0 0 10px;max-width:60ch}
.rec .own{font-size:14px;color:var(--mute);margin:0}
.empty{padding:32px 0;border-bottom:1px solid var(--line)}
.empty p{margin:0 0 8px}

/* Actions */
.prio-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;align-items:start}
.matrix svg{width:100%;height:auto;display:block;overflow:visible}
.matrix a{cursor:pointer}
.rule{font-size:15px;color:var(--mute);margin:16px 0 0;max-width:56ch}
.checkin{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;background:var(--stone);padding:14px 16px;margin:0 0 16px;font-size:15px}
.checkin strong{font-weight:500}
.skey{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:14px;color:var(--mute)}
.skey span{display:inline-flex;align-items:center;gap:8px}

/* Scorecard */
.toggle{display:inline-flex;border:1px solid var(--ink);margin-bottom:24px}
.toggle button{background:none;border:0;padding:10px 18px;font-size:15px;cursor:pointer}
.toggle button[aria-pressed="true"]{background:var(--ink);color:var(--canvas)}
.measures{border-top:1px solid var(--ink)}
.measure{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:center;padding:22px 0;border-bottom:1px solid var(--line)}
.measure h3{font-weight:400;font-size:18px;line-height:1.3;margin:0 0 4px}
.measure .unit{font-size:14px;color:var(--mute)}
.measure .src{font-size:13.5px;color:var(--mute);margin-top:6px}
.track{position:relative;height:44px}
.track .rail{position:absolute;left:0;right:0;top:22px;height:1px;background:var(--line)}
.track .pt{position:absolute;top:22px;transform:translate(-50%,-50%);transition:left .6s cubic-bezier(.2,.7,.2,1),opacity .4s}
.pt.audit{width:13px;height:13px;border:1.5px solid var(--ink);border-radius:50%;background:var(--canvas)}
.pt.now{width:13px;height:13px;background:var(--ink);border-radius:50%}
.pt.target{width:1.5px;height:26px;background:var(--ink)}
.track .fill{position:absolute;top:21.5px;height:2px;background:var(--ink);transition:left .6s cubic-bezier(.2,.7,.2,1),width .6s cubic-bezier(.2,.7,.2,1),opacity .4s}
.readout{font-size:15px;display:grid;grid-template-columns:auto auto;gap:2px 14px;justify-content:start;margin:0}
.readout dt{color:var(--mute)}
.readout dd{margin:0}
.readout .status{grid-column:1/-1;margin-top:6px;font-weight:500}

/* Parties */
.pcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.pcard{display:block;border:1px solid var(--line);padding:20px;text-decoration:none}
.pcard:hover{border-color:var(--ink)}
.pcard b{display:block;font-weight:400;font-size:21px;margin-bottom:10px}
.pcard .nums{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:14px;color:var(--mute)}
.share{display:flex;flex-wrap:wrap;align-items:center;gap:12px;background:var(--stone);padding:16px;margin:0 0 40px}
.share p{margin:0;flex:1 1 100%;font-size:15px}
.share input{flex:1 1 280px;min-width:0;font:inherit;font-size:14px;padding:9px 10px;border:1px solid var(--line);background:var(--canvas);color:var(--ink)}
.pstrip{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--ink);margin-bottom:48px}
.pstrip div{padding:16px 12px 4px 0}
.pstrip div+div{padding-left:14px;border-left:1px solid var(--line)}
.pstrip b{display:block;font-weight:300;font-size:36px;line-height:1}
.pstrip span{display:block;font-size:14px;color:var(--mute);margin-top:6px}
.tplist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 32px;border-top:1px solid var(--ink)}
.tplist div{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);font-size:15.5px}
.tplist div span:first-child{display:flex;gap:10px;align-items:center}
.tplist small{color:var(--mute);font-size:13.5px;text-align:right}

/* Resources */
.rlist{border-top:1px solid var(--ink)}
.rlist div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 24px;padding:16px 0;border-bottom:1px solid var(--line)}
.rlist b{font-weight:400;font-size:17px}
.rlist p{grid-column:1;margin:0;color:var(--mute);font-size:15px}
.rlist .inc{grid-row:1/3;grid-column:2;font-size:13px;color:var(--mute);border:1px solid var(--line);padding:3px 9px;align-self:start;white-space:nowrap}

/* Prev next */
.pn{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:72px;border-top:1px solid var(--ink);padding-top:20px}
.pn a{text-decoration:none;display:block;padding:14px 0}
.pn a small{display:block;font-size:13px;color:var(--mute)}
.pn a span{font-size:19px}
.pn a:hover span{text-decoration:underline;text-underline-offset:4px}
.pn .next{text-align:right;grid-column:2}
.foot{margin-top:40px;font-size:13.5px;color:var(--mute);max-width:70ch}

/* Map chips, inline marker */
.map .tp{display:block}
.map .tp>.mk,.map .tp>svg{display:inline-block;vertical-align:0;margin:0 5px 0 0}
.map .tp>span{display:inline}

/* Responsive */
@media (max-width:1360px){:root{--side-w:236px}.main{padding-left:36px;padding-right:36px}}
@media (max-width:1000px){
  .shell{display:block}
  .side{display:none}
  .topbar{display:flex;position:sticky;top:calc(var(--banner-h) + env(safe-area-inset-top,0px));z-index:40;background:var(--canvas);border-bottom:1px solid var(--line);align-items:center;justify-content:space-between;gap:12px;padding:10px 20px}
  .topbar .tb-l{display:flex;align-items:center;gap:12px;min-width:0}
  .topbar .tb-l img{width:118px;height:auto;flex:none}
  .topbar .tb-l span{padding-left:12px;border-left:1px solid var(--line)}
  .topbar .tb-l span{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .menubtn{border:1px solid var(--ink);background:none;padding:7px 14px;font-size:15px;cursor:pointer;flex:none}
  .menu{position:fixed;left:0;right:0;bottom:0;top:calc(var(--banner-h) + env(safe-area-inset-top,0px));z-index:50;background:var(--canvas);overflow-y:auto;padding:16px 20px calc(40px + env(safe-area-inset-bottom,0px))}
  .menu.open{display:block}
  .menu .nav a{font-size:17px;padding-top:11px;padding-bottom:11px;margin-left:0}
  .menu .nav .sub a{font-size:15.5px;padding-top:8px;padding-bottom:8px}
  .menu .side-foot{margin-top:24px}
  .main{padding:32px 20px 140px}
  html{scroll-padding-top:calc(var(--banner-h) + env(safe-area-inset-top,0px) + 76px)}
  .finding,.win,.panel{scroll-margin-top:calc(var(--banner-h) + 76px)}
  .map{display:none}
  .mstack{display:block}
  .prio-grid{grid-template-columns:1fr;gap:32px}
  .matrix{max-width:520px}
  .measure{grid-template-columns:1fr 1fr}
  .measure .track{grid-column:1/-1;order:3}
}
@media (max-width:720px){
  :root{--banner-h:52px}
  body{font-size:16px}
  .banner p{padding:0 20px;font-size:13px;line-height:1.35}
  .covers{margin-bottom:36px}
  .strip{grid-template-columns:repeat(2,1fr)}
  .strip div{padding:14px 0 12px!important;border-left:0!important;border-bottom:1px solid var(--line)}
  .strip div:nth-child(even){padding-left:14px!important;border-left:1px solid var(--line)!important}
  .strip div:nth-last-child(-n+2){border-bottom:0}
  .strip b{font-size:34px}
  .use,.cards,.methods,.pcards,.tplist{grid-template-columns:1fr}
  .use{gap:18px}
  .timeline{grid-template-columns:1fr}
  .timeline li{padding:14px 0!important;border-left:0!important;border-bottom:1px solid var(--line)}
  .defs{grid-template-columns:1fr}
  .defs dt{border-bottom:0;padding-bottom:2px}
  .defs dd{padding-top:0}
  .panel{grid-template-columns:1fr;gap:16px;padding:20px}
  .win,.finding{grid-template-columns:1fr;gap:16px}
  .fgroup{grid-template-columns:1fr;gap:8px}
  .fgroup .flabel{padding-top:0}
  .measure{grid-template-columns:1fr;gap:10px}
  .measure .track{order:0}
  .toggle{display:flex}
  .toggle button{flex:1;padding:10px 8px}
  .pstrip{grid-template-columns:repeat(2,1fr)}
  .pstrip div{border-left:0!important;padding-left:0!important;border-bottom:1px solid var(--line);padding-bottom:12px}
  .pstrip div:nth-child(even){padding-left:14px!important;border-left:1px solid var(--line)!important}
  .plist a{grid-template-columns:32px 1fr}
  .plist a .status{grid-column:2}
  .pn{grid-template-columns:1fr}
  .pn .next{grid-column:1}
  .tbl.stack thead{display:none}
  .tbl.stack,.tbl.stack tbody,.tbl.stack tr,.tbl.stack td{display:block;width:100%}
  .tbl.stack tr{border-bottom:1px solid var(--line);padding:12px 0}
  .tbl.stack tr:first-child{border-top:1px solid var(--ink)}
  .tbl.stack td{border:0;padding:3px 0}
  .tbl.stack td[data-l]::before{content:attr(data-l);display:block;font-size:12.5px;color:var(--mute)}
  .tbl.stack td.lead-cell{font-size:17px;padding-bottom:6px}
  .tbl.stack td[data-l]{display:inline-block;width:auto;margin:0 20px 6px 0;vertical-align:top}
  .tbl.stack td.num{display:block;font-size:14px;color:var(--mute)}
  .tbl.stack td.num::before{display:inline;margin-right:5px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Accent layer */
h1{color:var(--h1)}
.eyebrow{color:var(--accent)}
.covers{background:var(--box);border-left:3px solid var(--moment);padding:16px 20px}
.covers h2{color:var(--accent)}
.covers p{color:var(--ink)}
.sec>h2,.group-h,.stage-group>h3{color:var(--h2)}
.stage-group>h3{border-bottom-color:var(--h2)}
.strip b,.pstrip b,.methods b{color:var(--accent)}
.strip,.pstrip,.methods,.timeline,.use,.defs,.findings,.plist,.measures,.rlist,.tplist,.pn{border-top-color:var(--accent)!important}
.dates strong,.side-foot strong,.checkin strong{color:var(--accent)}
.timeline b,.use h3,.methods h3,.evidence h4{color:var(--accent)}
.defs dt{color:var(--h1)}
.note{background:var(--note-bg);color:var(--note-fg);padding:28px 30px;margin:0 0 56px}
.note h2{color:var(--note-fg);font-weight:400;font-size:clamp(22px,2.4vw,28px);margin:0 0 12px}
.note p{max-width:64ch;margin:0 0 12px;color:var(--note-fg)}
.note p:last-child{margin-bottom:0;color:var(--note-sub)}
.rec{background:var(--box);border-color:var(--box)}
.rec h4{color:var(--accent)}
.rec.moment{background:var(--moment-bg);border-color:var(--moment-bg);color:var(--moment-fg)}
.rec.moment h4{color:var(--moment-fg)}
.rec.moment .own{color:var(--moment-sub)}
.win .keep b{color:var(--accent)}
.checkin,.share{background:var(--box-warm);border-left:3px solid var(--accent)}
.panel{background:var(--box)}
.nav a[aria-current="page"]{border-left-color:var(--prio);color:var(--h2)}
.nav a[aria-current="page"] .no{color:var(--h2)}
.card:hover,.pcard:hover,.plinks a:hover{border-color:var(--accent)}
.card b,.pcard b{color:var(--h1)}
.card .no{color:var(--accent)}
.btn{background:var(--note-bg);border-color:var(--note-bg);color:var(--note-fg)}
.btn.ghost{background:none;color:var(--h1);border-color:var(--h1)}
.tbl th{border-bottom-color:var(--accent);color:var(--accent)}
.pn a span{color:var(--h1)}
.dm{display:inline-block;background:var(--moment-bg);color:var(--moment-fg);padding:2px 8px;font-size:13px;line-height:1.35}

/* Ideal journey */
.inote{display:flex;gap:14px;align-items:flex-start;border:1.5px solid var(--prio);padding:14px 18px;margin:0 0 28px;max-width:72ch}
.inote b{color:var(--prio);font-weight:500;white-space:nowrap}
.inote p{margin:0}
.istrip{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--accent);margin:0 0 28px}
.istrip div{padding:14px 12px 4px 0}
.istrip div+div{padding-left:14px;border-left:1px solid var(--line)}
.istrip b{display:block;font-weight:300;font-size:34px;line-height:1;color:var(--accent)}
.istrip span{display:block;font-size:14px;color:var(--mute);margin-top:6px}
.ipromise{padding:10px 8px;font-size:12.5px;line-height:1.35;color:var(--h1);background:var(--box)}
.ipromise-l{padding:10px;font-size:12.5px;line-height:1.3;color:var(--mute);background:var(--box)}
.ipromise-l b{display:block;font-weight:500;color:var(--ink);font-size:14px;margin-bottom:4px}
.itp{overflow-wrap:break-word;hyphens:auto;display:block;width:100%;text-align:left;font-size:12.5px;line-height:1.25;padding:6px;border:1px solid var(--line);background:var(--canvas);color:var(--mute);cursor:pointer}
.itp .ic{display:inline-block;vertical-align:-1px;margin-right:5px}
.itp.moment{background:var(--moment-bg);border-color:var(--moment-bg);color:var(--moment-fg)}
.itp.new{border:1.5px dashed var(--accent);color:var(--ink);background:var(--box-warm)}
.itp.improved{border-color:var(--accent);color:var(--ink)}
.itp.kept{color:var(--ink)}
.itp:hover{outline:1px solid var(--ink)}
.itp[aria-pressed="true"]{outline:2px solid var(--ink);outline-offset:1px}
.mst .itp{font-size:14.5px;padding:9px 10px}
.mst .itp small{display:block;font-size:12.5px;opacity:.8;margin-top:2px}
.mst .ipromise-m{font-size:14px;color:var(--h1);margin:0 0 10px;max-width:60ch}
.ilegend .lg{display:inline-block;width:22px;height:12px;border:1px solid var(--line)}
.ilegend .lg.moment{background:var(--moment-bg);border-color:var(--moment-bg)}
.ilegend .lg.new{border:1.5px dashed var(--accent);background:var(--box-warm)}
.ilegend .lg.improved{border-color:var(--accent)}
.ipanel-status{display:inline-block;font-size:13px;padding:2px 8px;margin:8px 0 0;border:1px solid var(--line)}
.ipanel-status.moment{background:var(--moment-bg);color:var(--moment-fg);border-color:var(--moment-bg)}
.ipanel-status.new{border:1.5px dashed var(--accent)}
.ipanel-status.improved{border-color:var(--accent);color:var(--h1)}
.iline{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--mute);padding:0 10px 8px}
.iline span{display:inline-flex;align-items:center;gap:6px}
@media (max-width:720px){.istrip{grid-template-columns:repeat(2,1fr)}.istrip div{border-left:0!important;padding-left:0!important;border-bottom:1px solid var(--line);padding-bottom:10px}.istrip div:nth-child(even){padding-left:14px!important;border-left:1px solid var(--line)!important}.inote{flex-direction:column;gap:4px}}

/* Redaction */
.rd{filter:blur(4.5px);-webkit-user-select:none;user-select:none;pointer-events:none}
h3 .rd,h4 .rd,.pt-title .rd{filter:blur(5.5px)}
b .rd,.strip b .rd,.pstrip b .rd,.istrip b .rd{filter:blur(5px)}
.rd-block{filter:blur(6px);-webkit-user-select:none;user-select:none;pointer-events:none}
.rd-note{display:inline-block;font-size:12px;letter-spacing:.06em;color:var(--prio);border:1px solid var(--prio);padding:1px 8px;margin:0 0 12px}
@media print{.banner{position:static}.shell{display:block;padding-top:0}.side,.topbar,.menu,.filters,.share,.pn{display:none}}
</style>
</head>

function scoreChart(series,mobile,note){
  var W8=800,H=mobile?210:156,top=mobile?40:28,bot=mobile?46:22,span=H-top-bot,fs=mobile?24:13;
  function y(v){return top+span*(1-v/100)}
  function pts(arr){return arr.map(function(v,i){return [W8/16+i*W8/8,y(v)]})}
  function path(p){var d='M'+p[0][0]+' '+p[0][1].toFixed(1);
    for(var i=0;i<p.length-1;i++){var p0=p[i-1]||p[i],p1=p[i],p2=p[i+1],p3=p[i+2]||p2;
      d+=' C'+(p1[0]+(p2[0]-p0[0])/6).toFixed(1)+' '+(p1[1]+(p2[1]-p0[1])/6).toFixed(1)+' '+(p2[0]-(p3[0]-p1[0])/6).toFixed(1)+' '+(p2[1]-(p3[1]-p1[1])/6).toFixed(1)+' '+p2[0]+' '+p2[1].toFixed(1)}
    return d}
  var s='<svg viewBox="0 0 '+W8+' '+H+'" role="img" aria-label="Buyer confidence, average score out of 10 at each of the eight stages">';
  [0,5,10].forEach(function(g){var gy=y(g*10).toFixed(1);
    s+='<line x1="'+(mobile?34:22)+'" x2="'+W8+'" y1="'+gy+'" y2="'+gy+'" stroke="var(--line)" stroke-width="1"/>';
    s+='<text x="0" y="'+(+gy+fs*0.35).toFixed(1)+'" font-size="'+(fs-2)+'" fill="var(--mute)" font-family="inherit">'+g+'</text>'});
  s+='<defs><filter id="rdblur" x="-5%" y="-30%" width="110%" height="160%"><feGaussianBlur stdDeviation="'+(mobile?6:3.5)+'"/></filter></defs><g filter="url(#rdblur)">';
  series.forEach(function(sr){
    var p=pts(sr.vals),sw=mobile?2.6:1.7;
    s+='<path d="'+path(p)+'" fill="none" stroke="'+sr.color+'" stroke-width="'+sw+'"'+(sr.dash?' stroke-dasharray="6 6" opacity=".75"':'')+'/>';
    p.forEach(function(q,i){
      var fill=sr.hollow&&i!==sr.low?'var(--canvas)':sr.color;
      s+='<circle cx="'+q[0]+'" cy="'+q[1].toFixed(1)+'" r="'+(mobile?7:4.5)+'" fill="'+fill+'" stroke="'+sr.color+'" stroke-width="1.6"/>';
      if(sr.label){var ly=sr.label==='above'?q[1]-(mobile?14:9):q[1]+(mobile?32:19);
        s+='<text x="'+q[0]+'" y="'+ly.toFixed(1)+'" text-anchor="middle" font-size="'+fs+'" font-weight="500" fill="'+(sr.labelColor||sr.color)+'" font-family="inherit">'+(sr.vals[i]/10).toFixed(1)+'</text>'}
    });
  });
  s+='</g>';
  if(mobile)for(var i=0;i<8;i++)s+='<text x="'+(W8/16+i*W8/8)+'" y="'+(H-4)+'" text-anchor="middle" font-size="22" fill="var(--mute)" font-family="inherit">'+(i+1)+'</text>';
  if(false&&note&&!mobile){var lp=pts(series[0].vals)[4];s+='<text x="'+(lp[0]+14)+'" y="'+(lp[1]+5).toFixed(1)+'" font-size="13" fill="var(--mute)" font-family="inherit">'+note+'</text>'}
  return s+'</svg>';
}

function matrixSvg(){
  var S=420,pad=46,cell=(S-pad)/5;

  var groups={};F.forEach(function(f){var k=f.i+'_'+f.e;(groups[k]=groups[k]||[]).push(f)});
  var dots='';
  Object.keys(groups).forEach(function(k){
    var g=groups[k],n=g.length;
    g.forEach(function(f,j){
      var cx=X(f.e),cy=Y(f.i);
      if(n>1){var ang=-Math.PI/2+j*2*Math.PI/n,rad=n>4?24:16;cx+=Math.cos(ang)*rad;cy+=Math.sin(ang)*rad}
      var isP=PRIORITY.indexOf(f.id)>-1;
      dots+='<a tabindex="-1"><circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="11" fill="'+(isP?'var(--prio)':'var(--canvas)')+'" stroke="'+(isP?'var(--prio)':'var(--ink)')+'" stroke-width="1.3"/>'+
        '<text x="'+cx.toFixed(1)+'" y="'+(cy+4).toFixed(1)+'" text-anchor="middle" font-size="11" font-family="inherit" fill="'+(isP?'var(--on-prio)':'var(--ink)')+'">'+f.id+'</text></a>';
    });
  });
  return '<svg viewBox="0 -26 '+S+' '+(S+36)+'" role="img" aria-label="Findings placed by commercial impact and effort">'+
    '<polygon points="'+pad+',0 '+S+',0 '+pad+','+(S-pad)+'" fill="var(--stone)"/>'+
    '<rect x="'+pad+'" y="0" width="'+(S-pad)+'" height="'+(S-pad)+'" fill="none" stroke="var(--ink)" stroke-width="1.2"/>'+
    '<line x1="'+pad+'" y1="'+(S-pad)+'" x2="'+S+'" y2="0" stroke="var(--ink)" stroke-width="1.2" opacity=".45"/>'+
    '<text x="'+pad+'" y="-10" font-size="13" font-family="inherit" fill="var(--mute)">Start above the line</text>'+
    '<text x="'+(S-12)+'" y="'+(S-pad-12)+'" font-size="13" font-family="inherit" fill="var(--mute)" text-anchor="end">Schedule or rethink</text>'+
    '<text x="'+(pad+(S-pad)/2)+'" y="'+(S-pad+26)+'" font-size="13" font-family="inherit" fill="var(--mute)" text-anchor="middle">Effort, lower to higher</text>'+
    '<text transform="translate(18 '+((S-pad)/2)+') rotate(-90)" font-size="13" font-family="inherit" fill="var(--mute)" text-anchor="middle">Commercial impact, lower to higher</text>'+

/* ---------- Router ---------- */
var current='';
function parse(hs){
  var h=(hs==null?location.hash:hs).replace(/^#\/?/,'');
  if(/^party=/.test(h))h='party/'+h.split('=')[1].split('&')[0];
  var q={},qi=h.indexOf('?');
  if(qi>-1){h.slice(qi+1).split('&').forEach(function(p){var kv=p.split('=');q[kv[0]]=decodeURIComponent(kv[1]||'')});h=h.slice(0,qi)}
  return {path:h||'overview',q:q};
}
function route(hs){
  var r=parse(hs),path=r.path,html,key=path;
  $('page').removeEventListener('click',mapClick);
  $('page').removeEventListener('click',idealClick);
  if(path.indexOf('party/')===0){html=pgParty(path.slice(6));key='party/'+path.slice(6)}
  else{
    var fn={overview:pgOverview,method:pgMethod,journey:pgJourney,ideal:pgIdeal,working:pgWorking,findings:pgFindings,actions:pgActions,scorecard:pgScorecard,parties:pgParties,resources:pgResources}[path];
    if(!fn){fn=pgOverview;key='overview'}
    html=fn();
  }
  $('page').innerHTML=html;
  $('page').classList.toggle('wide',key==='journey'||key==='ideal');
  var page=PAGES.filter(function(p){return p.k===key})[0];
  var title=page?page.n:(key.indexOf('party/')===0?lbl(PARTIES,key.slice(6)):'Overview');
  document.title=title+', Orchard Piper customer experience audit (illustrative sample)';
  $('tbTitle').textContent=title;
  Array.prototype.forEach.call(document.querySelectorAll('.nav a'),function(a){
    var on=a.dataset.page===key||(key.indexOf('party/')===0&&a.dataset.page==='parties'&&false);
    if(on)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');
  });
  closeMenu();
  if(key==='journey')bindMap();
  if(key==='ideal'){iStage='';iTp=0;$('page').addEventListener('click',idealClick)}
  if(key==='findings'){
    fstate={party:'',stage:'',tag:'',life:''};
    ['party','stage','tag','life'].forEach(function(k){if(r.q[k]&&OPTS[k].some(function(o){return o.k===r.q[k]}))fstate[k]=r.q[k]});
    bindFindings();
  }
  if(key==='scorecard'){
    Array.prototype.forEach.call(document.querySelectorAll('.toggle button'),function(b){
      b.addEventListener('click',function(){mode=b.dataset.mode;Array.prototype.forEach.call(document.querySelectorAll('.toggle button'),function(x){x.setAttribute('aria-pressed',x===b?'true':'false')});$('measures').innerHTML=measuresHtml()});
    });
    mode='audit';
  }
  if($('copyBtn'))$('copyBtn').addEventListener('click',function(){
    var inp=$('shareUrl'),btn=this;function ok(){btn.textContent='Link copied'}
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(inp.value).then(ok,function(){inp.select();try{document.execCommand('copy');ok()}catch(e){}});
    else{inp.select();try{document.execCommand('copy');ok()}catch(e){}}
  });
  var target=r.q.f?$('f'+r.q.f):(r.q.w?$('w'+r.q.w):null);
  if(target){setTimeout(function(){target.scrollIntoView({block:'start'});target.classList.add('flash')},20)}
  else window.scrollTo(0,0);
  if(!target)$('main').focus({preventScroll:true});
}
function go(h){
  try{history.pushState(null,'','#/'+h)}catch(e){}
  current=h;route('#/'+h);
}
document.addEventListener('click',function(e){
  var a=e.target.closest('a');if(!a)return;
  var href=a.getAttribute('href')||a.getAttribute('xlink:href')||'';
  if(href.indexOf('#/')!==0)return;
  if(e.metaKey||e.ctrlKey||e.shiftKey||e.button===1)return;
  e.preventDefault();go(href.slice(2));
});
window.addEventListener('hashchange',function(){route()});
window.addEventListener('popstate',function(){route()});
route();
})();
